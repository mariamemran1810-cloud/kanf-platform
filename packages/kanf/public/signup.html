<!doctype html>
<html lang="ar" dir="rtl" data-dir="rtl" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>إنشاء حساب — كنف</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a class="brand" href="/">
      <img src="/assets/logo.svg" alt="كنف" />
      <span>كنف<small data-ar="منصة الوكيل البرمجي" data-en="AI coding agent platform">منصة الوكيل البرمجي</small></span>
    </a>

    <h2 data-ar="أنشئ حسابك" data-en="Create your account">أنشئ حسابك</h2>
    <p class="sub" data-ar="مجاناً — بلا بطاقة ائتمان" data-en="Free — no credit card required">مجاناً — بلا بطاقة ائتمان</p>

    <div id="err" class="err" style="display:none"></div>

    <form id="form">
      <div class="field">
        <label data-ar="الاسم" data-en="Name">الاسم</label>
        <input class="input" type="text" name="name" required placeholder="مثال: مريم" />
      </div>
      <div class="field">
        <label data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</label>
        <input class="input" type="email" name="email" required dir="ltr" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label data-ar="كلمة المرور" data-en="Password">كلمة المرور</label>
        <input class="input" type="password" name="password" required dir="ltr" minlength="8" placeholder="••••••••" />
        <div class="hint" data-ar="٨ أحرف على الأقل وتضمّ رقماً" data-en="At least 8 characters including a digit">٨ أحرف على الأقل وتضمّ رقماً</div>
      </div>
      <button class="btn btn-primary" style="width:100%; margin-top:8px;" type="submit" data-ar="إنشاء الحساب" data-en="Sign up">إنشاء الحساب</button>
    </form>

    <p class="switch">
      <span data-ar="لديك حساب بالفعل؟" data-en="Already have an account?">لديك حساب بالفعل؟</span>
      <a href="/login.html" data-ar="سجّل دخولك" data-en="Log in">سجّل دخولك</a>
    </p>
    <div class="row" style="justify-content:center; margin-top:6px;">
      <button class="btn btn-ghost btn-sm" id="lang-btn" type="button">EN</button>
      <button class="btn btn-ghost btn-sm" id="theme-btn" type="button">🌙</button>
    </div>
  </div>
</div>

<script src="/assets/i18n.js"></script>
<script src="/assets/auth.js"></script>
</body>
</html>
